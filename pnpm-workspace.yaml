packages:
  - '.'

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - dompurify@3.4.7
  - dompurify@3.4.8

# monaco-editor (via @payloadcms/ui) pins dompurify to a vulnerable exact
# version; force the patched line until upstream bumps it
overrides:
  dompurify: ^3.4.0
