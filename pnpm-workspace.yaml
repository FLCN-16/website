packages:
  - '.'

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# monaco-editor (via @payloadcms/ui) pins dompurify to a vulnerable exact
# version; force the patched line until upstream bumps it.
# NOTE: this setting requires pnpm 10+. Vercel selects pnpm 9 for this
# project (by creation date) and ignores package.json#packageManager unless
# corepack is enabled — pnpm 9 can't read overrides from this file and fails
# its frozen-lockfile install. vercel.json's installCommand enables corepack,
# which honors the packageManager pin (pnpm 11.5.0) and keeps CI installs
# identical to local
overrides:
  dompurify: ^3.4.0
