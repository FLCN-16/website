<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0f1923"/>
  <!-- Grid lines -->
  <line x1="0" y1="125" x2="800" y2="125" stroke="#1e2a3a" stroke-width="1"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#1e2a3a" stroke-width="1"/>
  <line x1="0" y1="375" x2="800" y2="375" stroke="#1e2a3a" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="500" stroke="#1e2a3a" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="500" stroke="#1e2a3a" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="500" stroke="#1e2a3a" stroke-width="1"/>
  <!-- Code diff blocks -->
  <rect x="60" y="90" width="480" height="22" fill="#1a2d1a" rx="2"/>
  <rect x="60" y="90" width="6" height="22" fill="#2d5a2d" rx="0"/>
  <text x="76" y="106" font-family="monospace" font-size="11" fill="#4a8a4a">+ const result = await agent.review(prDiff);</text>
  <rect x="60" y="118" width="480" height="22" fill="#2a1a1a" rx="2"/>
  <rect x="60" y="118" width="6" height="22" fill="#5a2d2d" rx="0"/>
  <text x="76" y="134" font-family="monospace" font-size="11" fill="#8a4a4a">- const result = manualReview(prDiff);</text>
  <rect x="60" y="150" width="480" height="22" fill="#1a2d1a" rx="2"/>
  <rect x="60" y="150" width="6" height="22" fill="#2d5a2d" rx="0"/>
  <text x="76" y="166" font-family="monospace" font-size="11" fill="#4a8a4a">+ await github.postInlineComment(comment);</text>
  <rect x="60" y="178" width="480" height="22" fill="#1e2a3a" rx="2"/>
  <text x="76" y="194" font-family="monospace" font-size="11" fill="#3d5166">  pipeline.run({ model: 'llm', tools: [...] });</text>
  <rect x="60" y="206" width="480" height="22" fill="#1e2a3a" rx="2"/>
  <text x="76" y="222" font-family="monospace" font-size="11" fill="#3d5166">  orchestrate({ prompt, toolCalls, output });</text>
  <!-- Labels -->
  <text x="400" y="470" font-family="monospace" font-size="11" fill="#3d5166" text-anchor="middle" letter-spacing="4">GITHUB PR REVIEWER · AGENTIC AI · LANGCHAIN</text>
  <text x="620" y="300" font-family="monospace" font-size="28" font-weight="bold" fill="#c5d5de" letter-spacing="-1">AI</text>
  <text x="620" y="322" font-family="monospace" font-size="10" fill="#4a6275" letter-spacing="2">CODE REVIEW</text>
  <text x="620" y="350" font-family="monospace" font-size="28" font-weight="bold" fill="#c5d5de" letter-spacing="-1">LLM</text>
  <text x="620" y="372" font-family="monospace" font-size="10" fill="#4a6275" letter-spacing="2">PIPELINE</text>
</svg>
