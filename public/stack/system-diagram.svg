<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#0f1923"/>
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e2a3a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Client Layer -->
  <rect x="80" y="60" width="160" height="50" fill="#1e2a3a" stroke="#3d5166" stroke-width="1" rx="2"/>
  <text x="160" y="88" font-family="monospace" font-size="10" fill="#7a9aaa" text-anchor="middle" letter-spacing="2">BROWSER / CDN</text>

  <rect x="280" y="60" width="160" height="50" fill="#1e2a3a" stroke="#3d5166" stroke-width="1" rx="2"/>
  <text x="360" y="88" font-family="monospace" font-size="10" fill="#7a9aaa" text-anchor="middle" letter-spacing="2">NEXT.JS SSR</text>

  <rect x="480" y="60" width="160" height="50" fill="#1e2a3a" stroke="#3d5166" stroke-width="1" rx="2"/>
  <text x="560" y="88" font-family="monospace" font-size="10" fill="#7a9aaa" text-anchor="middle" letter-spacing="2">API GATEWAY</text>

  <rect x="680" y="60" width="160" height="50" fill="#1e2a3a" stroke="#3d5166" stroke-width="1" rx="2"/>
  <text x="760" y="88" font-family="monospace" font-size="10" fill="#7a9aaa" text-anchor="middle" letter-spacing="2">NODE / EXPRESS</text>

  <rect x="880" y="60" width="160" height="50" fill="#1e2a3a" stroke="#3d5166" stroke-width="1" rx="2"/>
  <text x="960" y="88" font-family="monospace" font-size="10" fill="#7a9aaa" text-anchor="middle" letter-spacing="2">DATABASE</text>

  <!-- Connections top row -->
  <line x1="240" y1="85" x2="280" y2="85" stroke="#3d5166" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <line x1="440" y1="85" x2="480" y2="85" stroke="#3d5166" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="640" y1="85" x2="680" y2="85" stroke="#3d5166" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="840" y1="85" x2="880" y2="85" stroke="#3d5166" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Infra Layer -->
  <text x="80" y="200" font-family="monospace" font-size="9" fill="#3d5166" letter-spacing="4">INFRASTRUCTURE</text>
  <line x1="80" y1="208" x2="1120" y2="208" stroke="#1e2a3a" stroke-width="1"/>

  <rect x="80" y="230" width="220" height="80" fill="#1a2535" stroke="#2d3f52" stroke-width="1" rx="2"/>
  <text x="190" y="265" font-family="monospace" font-size="10" fill="#5a7385" text-anchor="middle" letter-spacing="2">AWS / GCP</text>
  <text x="190" y="283" font-family="monospace" font-size="9" fill="#3d5166" text-anchor="middle">EC2 · S3 · CloudFront</text>

  <rect x="340" y="230" width="220" height="80" fill="#1a2535" stroke="#2d3f52" stroke-width="1" rx="2"/>
  <text x="450" y="265" font-family="monospace" font-size="10" fill="#5a7385" text-anchor="middle" letter-spacing="2">DOCKER / CI-CD</text>
  <text x="450" y="283" font-family="monospace" font-size="9" fill="#3d5166" text-anchor="middle">Jenkins · GitHub Actions</text>

  <rect x="600" y="230" width="220" height="80" fill="#1a2535" stroke="#2d3f52" stroke-width="1" rx="2"/>
  <text x="710" y="265" font-family="monospace" font-size="10" fill="#5a7385" text-anchor="middle" letter-spacing="2">MONITORING</text>
  <text x="710" y="283" font-family="monospace" font-size="9" fill="#3d5166" text-anchor="middle">Logs · Metrics · Alerts</text>

  <rect x="860" y="230" width="260" height="80" fill="#1a2535" stroke="#2d3f52" stroke-width="1" rx="2"/>
  <text x="990" y="265" font-family="monospace" font-size="10" fill="#5a7385" text-anchor="middle" letter-spacing="2">LINUX · SECURITY</text>
  <text x="990" y="283" font-family="monospace" font-size="9" fill="#3d5166" text-anchor="middle">Hardening · TLS · WAF</text>

  <!-- Data flow label -->
  <text x="600" y="430" font-family="monospace" font-size="11" fill="#2d3f52" text-anchor="middle" letter-spacing="4">SYSTEM DESIGN — THEFALCON.DEV</text>
  <text x="600" y="455" font-family="monospace" font-size="9" fill="#1e2a3a" text-anchor="middle" letter-spacing="3">FRONTEND TECHNICAL LEAD · HIGH-PERFORMANCE ARCHITECTURE</text>
</svg>
